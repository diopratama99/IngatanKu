# Configuration for Flutter's built-in gen_l10n pipeline.
# Run `flutter pub get` (or `flutter gen-l10n`) after editing any .arb
# under lib/l10n/ to regenerate the typed `AppLocalizations` class.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
output-dir: lib/l10n/generated
