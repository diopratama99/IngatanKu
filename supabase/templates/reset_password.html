<!-- Supabase Auth → Email Templates → Reset Password.
     Subject: Kode atur ulang kata sandi IngatanKu
     The app asks for the 6-digit code ({{ .Token }}); there's no link to click. -->
<div style="background:#F6F1EA;padding:32px 16px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#2B2118">
  <div style="max-width:440px;margin:0 auto;background:#FFFDF8;border:1px solid #E8DFD2;border-radius:16px;padding:28px 24px">
    <p style="margin:0 0 6px;font-size:12px;letter-spacing:2px;color:#8A7A66">INGATANKU</p>
    <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;color:#2B2118">Atur ulang kata sandi</h1>
    <p style="margin:0 0 22px;font-size:15px;line-height:1.55;color:#5C5045">Masukkan kode ini di aplikasi, lalu buat kata sandi barumu.</p>
    <p style="margin:0 0 22px;padding:14px 0;background:#F6F1EA;border-radius:12px;font-size:32px;font-weight:700;letter-spacing:8px;text-align:center;color:#5B4630">{{ .Token }}</p>
    <p style="margin:0;font-size:13px;line-height:1.55;color:#8A7A66">Kode ini berlaku 1 jam. Kalau kamu tidak meminta atur ulang kata sandi, abaikan email ini; kata sandimu tetap aman.</p>
    <hr style="border:none;border-top:1px solid #E8DFD2;margin:20px 0">
    <p style="margin:0;font-size:12px;line-height:1.55;color:#8A7A66">Your IngatanKu password reset code is <b>{{ .Token }}</b>. It expires in 1 hour.</p>
  </div>
</div>
